[project]
name = "qopt"
version = "0.1.0"
description = "QUBO / QAOA hybrid quantum-classical optimisation platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "qiskit>=1.2",
  "qiskit-aer>=0.15",
  "anthropic>=0.40",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.30"]
braket = ["amazon-braket-sdk>=1.80"]
dwave = ["dwave-ocean-sdk>=7.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qopt*"]

# Alembic migrations ship inside the package so installed deployments (Docker) can migrate at startup.
[tool.setuptools.package-data]
qopt = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["slow: longer-running scientific validation tests"]
