# Fly.io deployment: builds the repository Dockerfile on Fly's remote builders (no local Docker needed).
#   flyctl deploy          (secrets: QOPT_JWT_SECRET, QOPT_BOOTSTRAP_TOKEN set with `flyctl secrets set`)
app = "qopt-quantum-c4da"
primary_region = "sin"      # Singapore: closest Fly region to India (no Indian region is offered)

[build]
  dockerfile = "Dockerfile"

[env]
  QOPT_ENVIRONMENT = "production"
  QOPT_DATABASE_URL = "sqlite:////app/data/qopt.db"
  QOPT_CORS_ORIGINS = '["https://qopt-quantum-c4da.fly.dev"]'
  QOPT_WORKER_THREADS = "2"
  # Fly's proxy is the only thing that can reach the app: trust its X-Forwarded-For so per-IP rate limits see real
  # client addresses instead of the proxy's.
  FORWARDED_ALLOW_IPS = "*"

[[mounts]]
  source = "qopt_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine running: background jobs run in-process and SQLite lives on this machine's volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
