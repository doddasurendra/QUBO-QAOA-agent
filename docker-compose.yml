services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qopt
      POSTGRES_USER: qopt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qopt"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        EXTRAS: ""          # e.g. "[ibm]" or "[ibm,braket,dwave]" to install provider SDKs
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QOPT_ENVIRONMENT: production
      QOPT_DATABASE_URL: postgresql+psycopg://qopt:${POSTGRES_PASSWORD}@db:5432/qopt
      QOPT_CORS_ORIGINS: '["http://localhost:8000"]'
    restart: unless-stopped

volumes:
  pgdata:
