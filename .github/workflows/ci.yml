name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" pip-audit
      - name: Runtime limits (diagnostics for native-code crashes)
        run: |
          echo "ulimit -s: $(ulimit -s)"
          python -c "import threading, resource; print('thread stack_size:', threading.stack_size(), '| RLIMIT_STACK:', resource.getrlimit(resource.RLIMIT_STACK))"
          python -c "import platform, sys; print(platform.platform(), sys.version)"
          grep -m1 'model name' /proc/cpuinfo || true
          python -X faulthandler -c "from qiskit import QuantumCircuit; print('qiskit main thread ok', QuantumCircuit(1).num_qubits)" || echo "QISKIT MAIN-THREAD CRASH (exit $?)"
          python -X faulthandler -c "import threading; from qiskit import QuantumCircuit; t=threading.Thread(target=lambda: print('qiskit worker thread ok', QuantumCircuit(1).num_qubits)); t.start(); t.join()" || echo "QISKIT WORKER-THREAD CRASH (exit $?)"
          python -c "import qiskit, qiskit_aer, numpy, rustworkx; print('qiskit', qiskit.__version__, 'aer', qiskit_aer.__version__, 'numpy', numpy.__version__, 'rustworkx', rustworkx.__version__)"
      - name: repeated-lifespan experiment (diagnostic)
        continue-on-error: true
        env: { QOPT_WORKER_THREADS: "0", QOPT_BACKUP_INTERVAL_HOURS: "0", QOPT_JWT_SECRET: "test-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
        run: |
          cat > /tmp/ours.py <<'EOF'
          import sys, os
          from fastapi.testclient import TestClient
          from qopt.api.app import create_app
          from qopt.config import get_settings
          from qopt.db import reset_engine
          for i in range(int(sys.argv[1])):
              os.environ["QOPT_DATABASE_URL"] = f"sqlite:////tmp/r{i}.db"
              get_settings.cache_clear(); reset_engine()
              with TestClient(create_app()) as c: print(i, c.get("/api/health").status_code, flush=True)
          EOF
          cat > /tmp/bare.py <<'EOF'
          import sys
          from contextlib import asynccontextmanager
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          @asynccontextmanager
          async def life(app):
              from qiskit import QuantumCircuit
              QuantumCircuit(2); yield
          for i in range(int(sys.argv[1])):
              with TestClient(FastAPI(lifespan=life)) as c: print(i, flush=True)
          EOF
          for s in ours bare; do for n in 2 4; do python -X faulthandler /tmp/$s.py $n >/tmp/o 2>&1 && echo "RESULT $s x$n: OK" || { echo "RESULT $s x$n: CRASH after: $(grep -E '^[0-9]' /tmp/o | tr '\n' ' ')"; grep -m2 'File ' /tmp/o; }; done; done
      - run: python -X faulthandler -m pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit --progress-spinner off || (echo "::warning::pip-audit reported vulnerabilities" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "./backend"
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium ${{ matrix.browser }}   # setup always runs in chromium
      - name: Browser E2E tests (real backend + production build)
        working-directory: frontend
        env: { QOPT_PYTHON: python, CI: "true" }
        run: npm run build && npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qopt:ci .
