name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" pip-audit
      - name: Runtime limits (diagnostics for native-code crashes)
        run: |
          echo "ulimit -s: $(ulimit -s)"
          python -c "import threading, resource; print('thread stack_size:', threading.stack_size(), '| RLIMIT_STACK:', resource.getrlimit(resource.RLIMIT_STACK))"
          python -c "import platform, sys; print(platform.platform(), sys.version)"
          grep -m1 'model name' /proc/cpuinfo || true
          python -X faulthandler -c "from qiskit import QuantumCircuit; print('qiskit main thread ok', QuantumCircuit(1).num_qubits)" || echo "QISKIT MAIN-THREAD CRASH (exit $?)"
          python -X faulthandler -c "import threading; from qiskit import QuantumCircuit; t=threading.Thread(target=lambda: print('qiskit worker thread ok', QuantumCircuit(1).num_qubits)); t.start(); t.join()" || echo "QISKIT WORKER-THREAD CRASH (exit $?)"
          python -c "import qiskit, qiskit_aer, numpy, rustworkx; print('qiskit', qiskit.__version__, 'aer', qiskit_aer.__version__, 'numpy', numpy.__version__, 'rustworkx', rustworkx.__version__)"
      - name: Qiskit-in-event-loop-thread experiment (diagnostic)
        continue-on-error: true
        run: |
          cat > /tmp/v.py <<'EOF'
          import sys, threading, asyncio
          mode = sys.argv[1]
          def circ():
              from qiskit import QuantumCircuit
              QuantumCircuit(2)
          if mode == "asyncio-thread":            # event loop in a short-lived thread, twice
              async def co(): circ()
              for _ in range(2):
                  t = threading.Thread(target=lambda: asyncio.run(co())); t.start(); t.join()
          elif mode == "main-first+bare":        # Qiskit used in the main thread before the TestClient runs
              circ()
              mode = "bare"
          if mode == "bare":
              from contextlib import asynccontextmanager
              from fastapi import FastAPI
              from fastapi.testclient import TestClient
              @asynccontextmanager
              async def life(app):
                  circ(); yield
              for _ in range(2):
                  with TestClient(FastAPI(lifespan=life)): pass
          print("ok")
          EOF
          for m in asyncio-thread main-first+bare bare; do python -X faulthandler /tmp/v.py $m >/tmp/o 2>&1 && echo "RESULT $m: OK" || echo "RESULT $m: CRASH"; done
          for v in 2.6.1 2.5.2 2.4.2; do
            python -m venv /tmp/q$v && /tmp/q$v/bin/pip install -q "qiskit==$v" fastapi httpx >/dev/null 2>&1
            /tmp/q$v/bin/python -X faulthandler /tmp/v.py bare >/tmp/o 2>&1 && echo "RESULT qiskit $v bare: OK" || echo "RESULT qiskit $v bare: CRASH"
          done
          python -m venv /tmp/q262 && /tmp/q262/bin/pip install -q "qiskit==2.6.2" fastapi httpx >/dev/null 2>&1
          /tmp/q262/bin/python -X faulthandler /tmp/v.py bare >/tmp/o 2>&1 && echo "RESULT qiskit 2.6.2 clean venv bare: OK" || echo "RESULT qiskit 2.6.2 clean venv bare: CRASH"
          /tmp/q262/bin/pip list 2>/dev/null | grep -iE '^(qiskit|numpy|rustworkx|fastapi|starlette|anyio) '
      - run: python -X faulthandler -m pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit --progress-spinner off || (echo "::warning::pip-audit reported vulnerabilities" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "./backend"
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium ${{ matrix.browser }}   # setup always runs in chromium
      - name: Browser E2E tests (real backend + production build)
        working-directory: frontend
        env: { QOPT_PYTHON: python, CI: "true" }
        run: npm run build && npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qopt:ci .
