name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" pip-audit
      - run: python -X faulthandler -m pytest -q   # faulthandler: Python stack on native crashes
      - name: Dependency vulnerability scan
        run: pip-audit --progress-spinner off || (echo "::warning::pip-audit reported vulnerabilities" && exit 1)

  backend-postgres:
    # Same suite with every API-fixture test on its own fresh PostgreSQL database (the docker-compose setup).
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine              # same major version as docker-compose.yml
        env: { POSTGRES_PASSWORD: postgres }   # throwaway CI-only service, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QOPT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,postgres]"
      - run: python -X faulthandler -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "./backend"
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium ${{ matrix.browser }}   # setup always runs in chromium
      - name: Browser E2E tests (real backend + production build)
        working-directory: frontend
        env: { QOPT_PYTHON: python, CI: "true" }
        run: npm run build && npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qopt:ci .
